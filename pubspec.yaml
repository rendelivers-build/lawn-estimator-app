name: lawn_estimator
description: Field estimator for lawn care — measure lawn areas from satellite imagery and produce materials + pricing estimates.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  google_maps_flutter: ^2.12.1
  flutter_google_places_sdk: ^0.4.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.14.0
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
