plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// flutter_google_places_sdk_android 0.2.2 ships Kotlin written for the Places
// v3 API but pins the v5 native library, which fails compilation (upstream
// issue #137). Force the v3 library that 0.2.1 shipped with until the plugin
// itself is fixed.
configurations.all {
    resolutionStrategy {
        force "com.google.android.libraries.places:places:3.5.0"
    }
}

android {
    namespace = "com.rendelivers.lawnestimator"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.rendelivers.lawnestimator"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Google Maps API key read from android/local.properties.
        // See ../local.properties.example. The key is injected into the
        // manifest as ${MAPS_API_KEY} via manifestPlaceholders.
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        def mapsKey = ""
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { localProperties.load(it) }
            mapsKey = localProperties.getProperty("MAPS_API_KEY", "")
        }
        manifestPlaceholders["MAPS_API_KEY"] = mapsKey
    }

    buildTypes {
        release {
            // TODO: Configure the signing config below
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
