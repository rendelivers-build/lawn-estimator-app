allprojects {
    repositories {
        maven { url = uri("http://127.0.0.1:8081/") }
        google()
        mavenCentral()
    }
    // flutter_google_places_sdk_android 0.2.2 ships Kotlin written for the
    // Places v3 API but pins the v5 native library, which fails compilation
    // (upstream issue #137). This must live at the allprojects level: the
    // plugin compiles as its own Gradle subproject, so an app-level
    // configurations block never touches its compile classpath. Force the v3
    // library that plugin version 0.2.1 shipped with until the plugin is fixed.
    configurations.all {
        resolutionStrategy {
            force "com.google.android.libraries.places:places:3.5.0"
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
